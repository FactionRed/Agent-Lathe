name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The project is developed on Windows and its console handling has
      # already had a Windows-only bug (ASCII folding), so both are covered.
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      # No Blender on the runner. Every test that needs it skips itself with a
      # reason (`pytest -rs` lists them). What runs here is everything that does
      # not, including the stdio wire test that spawns the real server.
      - name: Test
        run: python -m pytest -q
      # models/build_all.py is deliberately not run here: all three assets use
      # bevel(), which needs Blender 5.2, and the runners have none. Run it
      # locally before touching a verifier rule (`python models/build_all.py
      # --no-render` exits non-zero if an asset reports an error). Installing a
      # pinned Blender in CI would close this gap; it is a separate decision
      # because of the download size and the version drift it invites.
